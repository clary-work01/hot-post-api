services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hot-post
      POSTGRES_PASSWORD: hot-post
      POSTGRES_DB: hot-post
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: